[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Autovision_Model_Development"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "AutoVision" },
]

readme = "README.md"

classifiers = [
  "Programming Language :: Python :: 3",
]

requires-python = "~=3.11.0"

[tool.flit.module]
name = "vehicle_metadata"

[tool.ruff]
line-length = 99
src = ["vehicle_metadata"]
include = ["pyproject.toml", "vehicle_metadata/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["vehicle_metadata"]
force-sort-within-sections = true