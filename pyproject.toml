[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Autovision_Model_Development"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "AutoVision" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["Autovision_Model_Development"]
include = ["pyproject.toml", "Autovision_Model_Development/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["Autovision_Model_Development"]
force-sort-within-sections = true

